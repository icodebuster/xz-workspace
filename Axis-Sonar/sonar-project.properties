# SonarQube analysis settings for Axis, kept outside Axis-ERP so that repo stays
# a plain copy of main. bin/sonar passes this file to the scanner and sets the
# base directory to ../Axis-ERP, so every path below is relative to Axis-ERP.
# The report paths, the work directory, the server address and the token come
# from bin/sonar (token: .env.sonar). Full guide: README.md

sonar.projectKey=xzibit-axis
sonar.projectName=Axis
sonar.sourceEncoding=UTF-8

# --- What gets analysed ------------------------------------------------------
# Ruby (app, lib, config, db), ERB as HTML, JavaScript (Stimulus, importmap),
# CSS, the Dockerfile and the deploy scripts. Files Axis-ERP's .gitignore leaves
# out (.env, config/master.key, tmp) are skipped by the scanner itself.
sonar.sources=app,lib,config,db,script,deploy,Dockerfile,Gemfile
sonar.tests=test
sonar.test.inclusions=test/**/*_test.rb,test/test_helper.rb,test/application_system_test_case.rb

# Generated or vendored, nobody edits them by hand.
sonar.exclusions=\
  db/schema.rb,\
  db/*_schema.rb,\
  app/assets/builds/**,\
  vendor/**,\
  public/**,\
  **/*.key,\
  **/*.enc

# --- Coverage ----------------------------------------------------------------
# Counted against Ruby the tests can reach. Views, JavaScript and CSS have no
# coverage report (no JS test runner), and config, migrations, seeds and rake
# tasks aren't what the suite is for, so none of them drag the figure down.
sonar.coverage.exclusions=\
  config/**,\
  db/**,\
  lib/tasks/**,\
  script/**,\
  deploy/**,\
  Dockerfile,\
  app/views/**,\
  app/javascript/**,\
  app/assets/**

# --- Duplication -------------------------------------------------------------
# Migrations and locale files repeat by nature.
sonar.cpd.exclusions=\
  db/migrate/**,\
  db/seeds/**,\
  config/locales/**
